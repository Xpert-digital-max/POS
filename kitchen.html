<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหน้าจอห้องครัว (KDS)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #121212; color: #ffffff; }
        .header { background: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; color: #E91E63; }
        .clock { font-size: 24px; font-weight: bold; color: #00BCD4; font-family: monospace; }
        .container { padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .ticket { background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-top: 6px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .ticket.status-new { border-top-color: #E91E63; } 
        .ticket.status-preparing { border-top-color: #FF9800; } 
        
        .ticket-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed #444; padding-bottom: 15px; margin-bottom: 15px; }
        .table-name { font-size: 22px; font-weight: bold; color: #fff; margin: 0; display: flex; flex-direction: column; gap: 5px; }
        .source-badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #333; display: inline-block; width: fit-content; }
        .order-time { font-size: 14px; color: #aaa; background: #333; padding: 4px 8px; border-radius: 4px; }
        
        .items-container { flex-grow: 1; margin-bottom: 10px; }
        .item-row { margin-bottom: 10px; font-size: 18px; line-height: 1.4; border-bottom: 1px solid #2a2a2a; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .item-qty { font-weight: bold; color: #00BCD4; margin-right: 10px; font-size: 20px; }
        .item-name { color: #fff; }
        .item-option { display: block; color: #8bc34a; font-size: 15px; margin-left: 30px; margin-top: 4px; }
        .item-note { display: block; color: #ff5252; font-size: 15px; font-weight: bold; margin-left: 30px; margin-top: 4px; }
        
        .item-action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s;}
        .item-action-btn:active { transform: scale(0.95); }
        .btn-item-start { background: #FF9800; color: #000; }
        .btn-item-done { background: #06C755; color: white; }

        .btn-large { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top: 10px;}
        .btn-start { background: #ffcc80; color: #e65100; border: 1px solid #e65100;}
        .btn-done { background: #a5d6a7; color: #1b5e20; border: 1px solid #1b5e20;}
        .btn-loading { background: #555 !important; color: #aaa !important; cursor: not-allowed; border: 1px solid #555 !important; }

        #soundUnlockOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; box-sizing: border-box; }
        .start-btn { padding: 20px 50px; font-size: 24px; font-weight: bold; background: #E91E63; color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 30px; box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4); }

        .empty-state { text-align: center; color: #555; font-size: 24px; margin-top: 100px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div id="soundUnlockOverlay">
        <h1 style="color: #E91E63; margin-bottom: 10px;">🍳 ระบบหน้าจอห้องครัว (KDS)</h1>
        <p style="color: #ccc; font-size: 18px;">กดปุ่มด้านล่างเพื่อเปิดรับออเดอร์และอนุญาตให้ระบบแจ้งเตือนด้วยเสียง</p>
        <button onclick="startSystem()" class="start-btn">🔊 เริ่มทำงาน (เข้ากะ)</button>
    </div>

    <!-- Modal ปฏิเสธรายการ -->
    <div id="rejectModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #1e1e1e; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; border-top: 5px solid #ff5252; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3 style="color: #ff5252; margin-top: 0; display: flex; align-items: center; gap: 8px;">❌ ปฏิเสธรายการ</h3>
            <p id="rejectItemName" style="color: #fff; font-size: 18px; margin-bottom: 20px; font-weight: bold;"></p>
            
            <label style="color: #ccc; display: block; margin-bottom: 8px; font-size: 14px;">โปรดระบุเหตุผล:</label>
            <select id="rejectReasonSelect" style="width: 100%; padding: 12px; border-radius: 8px; background: #333; color: white; border: 1px solid #555; font-size: 16px; margin-bottom: 10px;" onchange="checkCustomReason()">
                <option value="วัตถุดิบหมด">วัตถุดิบหมด</option>
                <option value="ไม่มีจำหน่ายแล้ว">ไม่มีจำหน่ายแล้ว</option>
                <option value="คิวเยอะทำไม่ทัน">คิวเยอะทำไม่ทัน</option>
                <option value="custom">พิมพ์เหตุผลเอง...</option>
            </select>
            
            <input type="text" id="rejectReasonCustom" placeholder="พิมพ์เหตุผลที่นี่..." style="width: 100%; padding: 12px; border-radius: 8px; background: #333; color: white; border: 1px solid #555; font-size: 16px; margin-bottom: 20px; display: none; box-sizing: border-box;">
            
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button onclick="closeRejectModal()" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #444; color: white; font-weight: bold; cursor: pointer; font-size: 16px;">ยกเลิก</button>
                <button onclick="confirmRejectItem()" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #ff5252; color: white; font-weight: bold; cursor: pointer; font-size: 16px;">ยืนยันปฏิเสธ</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h2>🍳 KDS - ครัวกลาง</h2>
        <div id="clockDisplay" class="clock">00:00:00</div>
    </div>

    <div class="container">
        <div id="orderGrid" class="grid">
            <div class="empty-state">กำลังโหลดออเดอร์...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let urlVid = urlParams.get('vid');
        let VENDOR_ID = urlVid || localStorage.getItem('test_vendor_id');
        if (urlVid) { localStorage.setItem('test_vendor_id', urlVid); }

        const supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        
        let activeOrders = [];
        let pollingTimer = null;
        let audioContext = null;
        let staffBranchId = null;
        let pendingReject = { orderId: null, itemIndex: null };

        setInterval(() => {
            document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString('th-TH');
        }, 1000);

        function startSystem() {
            document.getElementById('soundUnlockOverlay').style.display = 'none';
            if (!audioContext) { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioContext.state === 'suspended') { audioContext.resume(); }
            const osc = audioContext.createOscillator(); osc.connect(audioContext.destination); osc.start(); osc.stop(audioContext.currentTime + 0.01);
            
            const sessionRaw = localStorage.getItem('staff_session');
            if (sessionRaw) {
                try {
                    const session = JSON.parse(sessionRaw);
                    if (session.bid && session.bid !== 'null') staffBranchId = session.bid;
                } catch(e) {}
            }

            fetchOrders();
            pollingTimer = setInterval(fetchOrders, 3000); 
        }

        async function fetchOrders() {
            try {
                // Resolve Branch จริงก่อน เพื่อไม่พลาด Takeaway สาขาหลักที่มี UUID
                const { data:branchData } = await supabaseClient
                    .from('branches')
                    .select('id, branch_name')
                    .eq('vendor_id',VENDOR_ID);

                const branches=branchData || [];
                const branchNameMap={};
                branches.forEach(b=>{ branchNameMap[b.id]=b.branch_name || 'สาขา'; });

                if (!staffBranchId) {
                    const mainBranch=branches.find(b=>b.branch_name==='สาขาหลัก') || branches[0] || null;
                    if (mainBranch) staffBranchId=mainBranch.id;
                }

                let dineQuery=supabaseClient.from('table_orders')
                    .select('*, restaurant_tables(table_name)')
                    .eq('vendor_id',VENDOR_ID)
                    .in('order_status',['new','preparing']);
                if (staffBranchId) dineQuery=dineQuery.eq('branch_id',staffBranchId);
                const { data:dineInData,error:errDineIn }=await dineQuery;
                if (errDineIn) console.error('[KDS DINE-IN]',errDineIn);

                // Takeaway เข้า KDS หลังร้านกด "เห็นออเดอร์แล้ว" เท่านั้น
                let prepaidQuery=supabaseClient.from('orders')
                    .select('*')
                    .eq('vendor_id',VENDOR_ID)
                    .eq('status','processing')
                    .not('merchant_acknowledged_at','is',null);
                if (staffBranchId) prepaidQuery=prepaidQuery.eq('branch_id',staffBranchId);
                const { data:prepaidData,error:errPrepaid }=await prepaidQuery;
                if (errPrepaid) console.error('[KDS TAKEAWAY]',errPrepaid);

                const normalizedOrders=[];

                (dineInData || []).forEach(o=>{
                    o.source='dine_in';
                    o.displayTitle='โต๊ะ '+(o.restaurant_tables ? o.restaurant_tables.table_name : '-');
                    o.branchName=branchNameMap[o.branch_id] || 'สาขาหลัก';
                    o.badgeHtml='<span class="source-badge" style="color:#b388ff;border:1px solid #b388ff;">🟣 Dine-in</span>';
                    o.unified_status=o.order_status;
                    let items=typeof o.items==='string' ? JSON.parse(o.items) : o.items;
                    if (!Array.isArray(items)) items=items && typeof items==='object' ? Object.values(items) : [];
                    o.items=items.map(i=>({ ...i,status:i.status || 'pending' }));
                    normalizedOrders.push(o);
                });

                (prepaidData || []).forEach(o=>{
                    o.source='prepaid';
                    const ref=o.reference_no || o.id.substring(0,6).toUpperCase();
                    o.displayTitle=o.queue_no ? `คิว ${o.queue_no}` : 'Takeaway';
                    o.branchName=branchNameMap[o.branch_id] || 'สาขาหลัก';
                    o.badgeHtml=`<span class="source-badge" style="color:#69f0ae;border:1px solid #69f0ae;">🟢 Takeaway [${ref}]</span>`;
                    o.unified_status='preparing';
                    let items=typeof o.items==='string' ? JSON.parse(o.items) : o.items;
                    if (!Array.isArray(items)) items=items && typeof items==='object' ? Object.values(items) : [];
                    o.items=items.map(i=>({ ...i,status:i.status || 'pending' }));
                    normalizedOrders.push(o);
                });

                normalizedOrders.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

                let hasNewOrder=false;
                normalizedOrders.forEach(order=>{
                    if (!activeOrders.find(o=>o.id===order.id)) hasNewOrder=true;
                });
                if (hasNewOrder) playAlertSound();

                activeOrders=normalizedOrders;
                renderOrders();
            } catch(err) {
                console.error('Fetch Error:',err);
            }
        }

        function playAlertSound() {
            if (!audioContext) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            
            const playBeep = (startTime) => {
                const osc = audioContext.createOscillator(); const gain = audioContext.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(750, startTime);
                osc.connect(gain); gain.connect(audioContext.destination);
                gain.gain.setValueAtTime(0.5, startTime); gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
                osc.start(startTime); osc.stop(startTime + 0.2);
            };

            const now = audioContext.currentTime;
            playBeep(now); playBeep(now + 0.3);
        }

        function renderOrders() {
            const container=document.getElementById('orderGrid');
            if (activeOrders.length===0) {
                container.innerHTML='<div class="empty-state">🎉 เยี่ยมมาก! ไม่มีออเดอร์ค้างในครัวเลย</div>';
                return;
            }

            let html='';

            activeOrders.forEach(order=>{
                const timeStr=new Date(order.created_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
                const waitTimeMin=Math.floor((new Date()-new Date(order.created_at))/60000);
                const waitTimeDisplay=waitTimeMin>0 ? `(รอ ${waitTimeMin} นาที)` : '(เพิ่งสั่ง)';
                const timeColor=waitTimeMin>15 ? 'color:#ff5252;' : '';

                let itemsHtml='';
                const items=Array.isArray(order.items) ? order.items : [];

                items.forEach((item,index)=>{
                    const st=String(item.status || 'pending').toLowerCase();
                    const isFinished=['done','served','rejected'].includes(st);
                    const optStr=item.option ? `<span class="item-option">👉 ${item.option}</span>` : '';
                    const noteStr=item.note ? `<span class="item-note">📝 ${item.note}</span>` : '';
                    const rejectStr=(st==='rejected' && item.reject_reason) ? `<span class="item-note" style="margin-top:8px;">❌ ปฏิเสธ: ${item.reject_reason}</span>` : '';

                    let itemBtn='';
                    if (!isFinished) {
                        itemBtn=`
                            <div style="display:flex;gap:8px;flex-direction:column;">
                                <button onclick="finishKitchenItem('${order.id}',${index},this)" class="item-action-btn btn-item-done">✅ เสร็จ</button>
                                <button onclick="openRejectModal('${order.id}',${index},'${String(item.name||'รายการ').replace(/'/g,"\\'")}')" class="item-action-btn" style="background:#333;color:#ff5252;border:1px solid #ff5252;">❌ ปฏิเสธ</button>
                            </div>`;
                    } else if (st==='done' || st==='served') {
                        itemBtn='<span style="color:#69f0ae;font-weight:bold;">✅ เสร็จแล้ว</span>';
                    } else {
                        itemBtn='<span style="color:#ff5252;font-weight:bold;">❌ ปฏิเสธ</span>';
                    }

                    itemsHtml+=`
                        <div class="item-row" style="opacity:${isFinished ? '.55':'1'};">
                            <div>
                                <div><span class="item-qty">${item.qty || 1}x</span> <span class="item-name">${item.name || 'รายการอาหาร'}</span></div>
                                ${optStr}${noteStr}${rejectStr}
                            </div>
                            <div>${itemBtn}</div>
                        </div>`;
                });

                const cardClass='status-preparing';
                html+=`
                    <div class="ticket ${cardClass}">
                        <div>
                            <div class="ticket-header">
                                <div>
                                    <h3 class="table-name">${order.displayTitle}</h3>
                                    <div style="margin-top:6px;font-size:12px;color:#aaa;">🏬 ${order.branchName || 'สาขาหลัก'}</div>
                                    ${order.badgeHtml}
                                </div>
                                <div style="text-align:right;">
                                    <span class="order-time">⏰ ${timeStr}</span>
                                    <div style="font-size:13px;margin-top:5px;${timeColor}">${waitTimeDisplay}</div>
                                </div>
                            </div>
                            <div class="items-container">${itemsHtml}</div>
                        </div>
                    </div>`;
            });

            container.innerHTML=html;
        }

        async function saveKitchenItems(order,items) {
            const accepted=items.filter(i=>String(i.status || 'pending').toLowerCase()!=='rejected');
            const allDone=accepted.length>0 && accepted.every(i=>['done','served'].includes(String(i.status || '').toLowerCase()));

            if (order.source==='dine_in') {
                const nextStatus=allDone ? 'ready' : 'preparing';
                const { error }=await supabaseClient.from('table_orders')
                    .update({items,order_status:nextStatus})
                    .eq('id',order.id);
                if (error) throw error;
            } else {
                const nextStatus=allDone ? 'ready' : 'processing';
                const { error }=await supabaseClient.from('orders')
                    .update({items,status:nextStatus})
                    .eq('id',order.id);
                if (error) throw error;
            }
        }

        async function finishKitchenItem(orderId,itemIndex,btnElement) {
            try {
                if (btnElement) { btnElement.disabled=true; btnElement.innerText='...'; }
                const order=activeOrders.find(o=>o.id===orderId);
                if (!order) throw new Error('ไม่พบออเดอร์นี้');
                const items=order.items.map(i=>({...i}));
                if (!items[itemIndex]) throw new Error('ไม่พบรายการอาหารนี้');
                items[itemIndex].status='done';
                await saveKitchenItems(order,items);
                await fetchOrders();
            } catch(err) {
                console.error('[KDS FINISH ITEM]',err);
                alert('อัปเดตรายการไม่สำเร็จ: '+(err?.message||err));
                await fetchOrders();
            }
        }

        function openRejectModal(orderId, itemIndex, itemName) {
            pendingReject = { orderId, itemIndex };
            document.getElementById('rejectItemName').innerText = itemName;
            document.getElementById('rejectReasonSelect').value = "วัตถุดิบหมด";
            document.getElementById('rejectReasonCustom').value = "";
            document.getElementById('rejectReasonCustom').style.display = 'none';
            document.getElementById('rejectModal').style.display = 'flex';
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').style.display = 'none';
            pendingReject = { orderId: null, itemIndex: null };
        }

        function checkCustomReason() {
            const sel = document.getElementById('rejectReasonSelect').value;
            if (sel === 'custom') {
                document.getElementById('rejectReasonCustom').style.display = 'block';
                document.getElementById('rejectReasonCustom').focus();
            } else {
                document.getElementById('rejectReasonCustom').style.display = 'none';
            }
        }

        async function confirmRejectItem() {
            let reason=document.getElementById('rejectReasonSelect').value;
            if (reason==='custom') {
                reason=document.getElementById('rejectReasonCustom').value.trim();
                if (!reason) { alert('กรุณาพิมพ์เหตุผลที่ปฏิเสธ'); return; }
            }

            const { orderId,itemIndex }=pendingReject;
            closeRejectModal();

            try {
                const order=activeOrders.find(o=>o.id===orderId);
                if (!order) throw new Error('ไม่พบออเดอร์นี้');
                const items=order.items.map(i=>({...i}));
                items[itemIndex].status='rejected';
                items[itemIndex].reject_reason=reason || 'ร้านไม่สามารถทำรายการนี้ได้';
                await saveKitchenItems(order,items);
                await fetchOrders();
            } catch(e) {
                alert('เกิดข้อผิดพลาด: '+e.message);
                fetchOrders();
            }
        }

        // ==================== STATUS UPDATE LOGIC (compatibility) ====================
        // เก็บชื่อฟังก์ชันเดิมไว้เผื่อมีปุ่ม/โค้ดเก่าเรียก แต่ Flow ใหม่ใช้ finishKitchenItem / saveKitchenItems
        async function updateItemStatus(orderId,itemIndex,newStatus) {
            const order=activeOrders.find(o=>o.id===orderId);
            if (!order) return;
            const items=order.items.map(i=>({...i}));
            if (!items[itemIndex]) return;
            items[itemIndex].status=(newStatus==='done' ? 'done' : 'pending');
            await saveKitchenItems(order,items);
            await fetchOrders();
        }

        async function saveItemUpdate(order,items) {
            await saveKitchenItems(order,items);
        }

        async function updateAllItemsStatus(orderId,newStatus,btnElement) {
            try {
                if (btnElement) { btnElement.disabled=true; btnElement.innerText='กำลังอัปเดต...'; }
                const order=activeOrders.find(o=>o.id===orderId);
                if (!order) throw new Error('ไม่พบออเดอร์นี้ในหน้าครัว');
                const items=order.items.map(i=>String(i.status||'pending').toLowerCase()==='rejected' ? {...i} : ({...i,status:'done'}));
                await saveKitchenItems(order,items);
                await fetchOrders();
            } catch(err) {
                alert('เกิดข้อผิดพลาด: '+err.message);
                fetchOrders();
            }
        }

        async function updateOrderToServed(orderId,source) {
            // Flow ใหม่ไม่ปิดออเดอร์จาก KDS อัตโนมัติ
            // KDS ทำหน้าที่จนถึง READY เท่านั้น แล้วหน้าพนักงานเป็นผู้ส่งมอบ/เสิร์ฟ
            await fetchOrders();
        }

        // ==================== AUTH GUARD ====================
        let authCheckTimer = null;
        
        async function verifyStaffSession() {
            if (!VENDOR_ID) {
                forceLogout("ไม่พบรหัสร้านค้า");
                return false;
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('bypass_auth') === 'true') return true; 

            const sessionRaw = localStorage.getItem('staff_session');
            if (!sessionRaw) {
                forceLogout("กรุณาเข้าสู่ระบบก่อนใช้งาน");
                return false;
            }

            try {
                const session = JSON.parse(sessionRaw);
                if (session.role !== 'kitchen' && session.role !== 'cashier') {
                    forceLogout("คุณไม่มีสิทธิ์เข้าถึงหน้านี้");
                    return false;
                }
                
                let query = supabaseClient.from('branches').select('cashier_pin, kitchen_pin').eq('merchant_id', session.vid);
                if (session.bid && session.bid !== 'null') query = query.eq('id', session.bid);
                else query = query.eq('branch_name', 'สาขาหลัก');

                const { data, error } = await query.single();
                
                let isValid = false;
                if (!error && data) {
                    if (session.role === 'kitchen' && data.kitchen_pin === session.pin) isValid = true;
                    if (session.role === 'cashier' && data.cashier_pin === session.pin) isValid = true;
                }

                if (!isValid) {
                    forceLogout("รหัสผ่านถูกเปลี่ยนแปลง กรุณาเข้าสู่ระบบใหม่");
                    return false;
                }

                if (!authCheckTimer) {
                    authCheckTimer = setInterval(verifyStaffSession, 5000);
                }
                return true;

            } catch (e) {
                forceLogout("ข้อมูลเซสชันไม่ถูกต้อง");
                return false;
            }
        }

        function forceLogout(msg) {
            alert(msg);
            localStorage.removeItem('staff_session');
            let loginUrl = `staff-login.html?vid=${VENDOR_ID}`;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('bid') && urlParams.get('bid') !== 'null') loginUrl += `&bid=${urlParams.get('bid')}`;
            window.location.href = loginUrl;
        }

        window.onload = async () => {
            await verifyStaffSession();
        };
    </script>
</body>
</html>
