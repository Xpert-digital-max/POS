<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหน้าจอห้องครัว (KDS)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #121212; color: #ffffff; }
        .header { background: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; color: #E91E63; }
        .clock { font-size: 24px; font-weight: bold; color: #00BCD4; font-family: monospace; }
        .container { padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .ticket { background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-top: 6px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .ticket.status-new { border-top-color: #E91E63; } 
        .ticket.status-preparing { border-top-color: #FF9800; } 
        
        .ticket-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed #444; padding-bottom: 15px; margin-bottom: 15px; }
        .table-name { font-size: 22px; font-weight: bold; color: #fff; margin: 0; display: flex; flex-direction: column; gap: 5px; }
        .source-badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #333; display: inline-block; width: fit-content; }
        .order-time { font-size: 14px; color: #aaa; background: #333; padding: 4px 8px; border-radius: 4px; }
        
        .items-container { flex-grow: 1; margin-bottom: 10px; }
        .item-row { margin-bottom: 10px; font-size: 18px; line-height: 1.4; border-bottom: 1px solid #2a2a2a; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .item-qty { font-weight: bold; color: #00BCD4; margin-right: 10px; font-size: 20px; }
        .item-name { color: #fff; }
        .item-option { display: block; color: #8bc34a; font-size: 15px; margin-left: 30px; margin-top: 4px; }
        .item-note { display: block; color: #ff5252; font-size: 15px; font-weight: bold; margin-left: 30px; margin-top: 4px; }
        
        .item-action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-item-start { background: #FF9800; color: #000; }
        .btn-item-done { background: #06C755; color: white; }

        .btn-large { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top: 10px;}
        .btn-start { background: #ffcc80; color: #e65100; border: 1px solid #e65100;}
        .btn-done { background: #a5d6a7; color: #1b5e20; border: 1px solid #1b5e20;}
        .btn-loading { background: #555 !important; color: #aaa !important; cursor: not-allowed; border: 1px solid #555 !important; }

        #soundUnlockOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; box-sizing: border-box; }
        .start-btn { padding: 20px 50px; font-size: 24px; font-weight: bold; background: #E91E63; color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 30px; box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4); }

        .empty-state { text-align: center; color: #555; font-size: 24px; margin-top: 100px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div id="soundUnlockOverlay">
        <h1 style="color: #E91E63; margin-bottom: 10px;">🍳 ระบบหน้าจอห้องครัว (KDS)</h1>
        <p style="color: #ccc; font-size: 18px;">กดปุ่มด้านล่างเพื่อเปิดรับออเดอร์และอนุญาตให้ระบบแจ้งเตือนด้วยเสียง</p>
        <button onclick="startSystem()" class="start-btn">🔊 เริ่มทำงาน (เข้ากะ)</button>
    </div>

    <div class="header">
        <h2>🍳 KDS - ครัวกลาง</h2>
        <div id="clockDisplay" class="clock">00:00:00</div>
    </div>

    <div class="container">
        <div id="orderGrid" class="grid">
            <div class="empty-state">กำลังโหลดออเดอร์...</div>
        </div>
    </div>

    <script>
        // ดึง vid จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        let urlVid = urlParams.get('vid');

        let VENDOR_ID = urlVid || localStorage.getItem('test_vendor_id');
        if (urlVid) { localStorage.setItem('test_vendor_id', urlVid); }

        const supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        
        let activeOrders = [];
        let pollingTimer = null;
        let audioContext = null;
        let staffBranchId = null;

        setInterval(() => {
            document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString('th-TH');
        }, 1000);

        function startSystem() {
            document.getElementById('soundUnlockOverlay').style.display = 'none';
            if (!audioContext) { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioContext.state === 'suspended') { audioContext.resume(); }
            const osc = audioContext.createOscillator(); osc.connect(audioContext.destination); osc.start(); osc.stop(audioContext.currentTime + 0.01);
            
            // อ่านค่า Branch ID ของพนักงาน
            const sessionRaw = localStorage.getItem('staff_session');
            if (sessionRaw) {
                try {
                    const session = JSON.parse(sessionRaw);
                    if (session.bid && session.bid !== 'null') staffBranchId = session.bid;
                } catch(e) {}
            }

            fetchOrders();
            pollingTimer = setInterval(fetchOrders, 3000); 
        }

        async function fetchOrders() {
            try {
                // 1. ดึงข้อมูล Dine-in (table_orders)
                const { data: dineInData, error: errDineIn } = await supabaseClient.from('table_orders')
                    .select('*, restaurant_tables(table_name)')
                    .eq('vendor_id', VENDOR_ID)
                    .in('order_status', ['new', 'preparing']);
                if (errDineIn) console.error(errDineIn);

                // 2. ดึงข้อมูล Prepaid / Takeaway (orders)
                let prepaidQuery = supabaseClient.from('orders')
                    .select('*')
                    .eq('vendor_id', VENDOR_ID)
                    .in('status', ['pending', 'processing']); // Mapping: pending=รอครัวรับ, processing=กำลังทำ
                if (staffBranchId) {
                    prepaidQuery = prepaidQuery.eq('branch_id', staffBranchId);
                } else {
                    prepaidQuery = prepaidQuery.is('branch_id', null);
                }
                const { data: prepaidData, error: errPrepaid } = await prepaidQuery;
                if (errPrepaid) console.error(errPrepaid);

                // 3. Mapping Layer รวมศูนย์ข้อมูล
                let normalizedOrders = [];

                if (dineInData) {
                    dineInData.forEach(o => {
                        o.source = 'dine_in';
                        o.displayTitle = 'โต๊ะ ' + (o.restaurant_tables ? o.restaurant_tables.table_name : '-');
                        o.badgeHtml = '<span class="source-badge" style="color:#b388ff; border: 1px solid #b388ff;">🟣 Dine-in</span>';
                        o.unified_status = o.order_status;
                        normalizedOrders.push(o);
                    });
                }

                if (prepaidData) {
                    prepaidData.forEach(o => {
                        o.source = 'prepaid';
                        let q = o.queue_no ? `(คิว ${o.queue_no})` : '';
                        let ref = o.reference_no ? o.reference_no : o.id.substring(0,6).toUpperCase();
                        o.displayTitle = `กลับบ้าน ${q}`;
                        o.badgeHtml = `<span class="source-badge" style="color:#69f0ae; border: 1px solid #69f0ae;">🟢 Prepaid [${ref}]</span>`;
                        o.unified_status = o.status === 'pending' ? 'new' : 'preparing';
                        
                        let items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
                        let itemsArray = Array.isArray(items) ? items : Object.values(items);
                        // เติม status ระดับเมนูให้ Prepaid เพื่อให้ KDS ทำงานได้
                        itemsArray.forEach(i => {
                            if (!i.status) {
                                i.status = o.status === 'processing' ? 'cooking' : 'new';
                            }
                        });
                        o.items = itemsArray;
                        normalizedOrders.push(o);
                    });
                }

                // เรียงตามเวลาเก่าสุดขึ้นก่อน
                normalizedOrders.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

                // เช็คออเดอร์ใหม่เพื่อเล่นเสียง
                let hasNewOrder = false;
                normalizedOrders.forEach(order => {
                    const existingOrder = activeOrders.find(o => o.id === order.id);
                    if (!existingOrder && order.unified_status === 'new') {
                        hasNewOrder = true;
                    }
                });
                if (hasNewOrder) playAlertSound();
                
                activeOrders = normalizedOrders;
                renderOrders();

            } catch (err) { console.error("Fetch Error:", err); }
        }

        function playAlertSound() {
            if (!audioContext) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            
            const playBeep = (startTime) => {
                const osc = audioContext.createOscillator(); const gain = audioContext.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(750, startTime);
                osc.connect(gain); gain.connect(audioContext.destination);
                gain.gain.setValueAtTime(0.5, startTime); gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
                osc.start(startTime); osc.stop(startTime + 0.2);
            };

            const now = audioContext.currentTime;
            playBeep(now); playBeep(now + 0.3);
        }

        function renderOrders() {
            const container = document.getElementById('orderGrid');
            if (activeOrders.length === 0) { 
                container.innerHTML = '<div class="empty-state">🎉 เยี่ยมมาก! ไม่มีออเดอร์ค้างในครัวเลย</div>'; return; 
            }

            let html = '';
            activeOrders.forEach(order => {
                const timeStr = new Date(order.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                
                const waitTimeMin = Math.floor((new Date() - new Date(order.created_at)) / 60000);
                const waitTimeDisplay = waitTimeMin > 0 ? `(รอ ${waitTimeMin} นาที)` : '(เพิ่งสั่ง)';
                const timeColor = waitTimeMin > 15 ? 'color: #ff5252;' : ''; 

                let itemsHtml = '';
                let items = order.items;
                let allServed = true;
                let hasNew = false;

                items.forEach((item, index) => {
                    if (item.status !== 'served' && item.status !== 'done') allServed = false;
                    if (item.status === 'new') hasNew = true;

                    let optStr = item.option ? `<span class="item-option">👉 ${item.option}</span>` : '';
                    let noteStr = item.note ? `<span class="item-note">📝 ** ${item.note}</span>` : '';
                    
                    let itemBtn = '';
                    if (item.status === 'new') {
                        itemBtn = `<button onclick="updateItemStatus('${order.id}', ${index}, 'cooking')" class="item-action-btn btn-item-start">🔥 ทำ</button>`;
                    } else if (item.status === 'cooking' || item.status === 'preparing') {
                        itemBtn = `<button onclick="updateItemStatus('${order.id}', ${index}, 'done')" class="item-action-btn btn-item-done">✅ เสร็จ</button>`;
                    }

                    const opacity = item.status === 'done' || item.status === 'served' ? '0.5' : '1';

                    itemsHtml += `
                    <div class="item-row" style="opacity: ${opacity};">
                        <div>
                            <div><span class="item-qty">${item.qty}x</span> <span class="item-name">${item.name}</span></div>
                            ${optStr} ${noteStr}
                        </div>
                        <div>${itemBtn}</div>
                    </div>`;
                });

                // ถ้ารายการในใบนี้เสร็จทั้งหมด
                if (allServed) {
                    updateOrderToServed(order.id, order.source);
                    return; 
                }

                const isNew = hasNew && order.unified_status === 'new';
                const cardClass = isNew ? 'status-new' : 'status-preparing';
                
                let orderActionBtn = '';
                if (hasNew) {
                    orderActionBtn = `<button id="btn_${order.id}" onclick="updateAllItemsStatus('${order.id}', 'cooking', this)" class="btn-large btn-start">รับทำทั้งหมด</button>`;
                } else {
                    orderActionBtn = `<button id="btn_${order.id}" onclick="updateAllItemsStatus('${order.id}', 'done', this)" class="btn-large btn-done">เสร็จทั้งหมด</button>`;
                }

                html += `
                <div class="ticket ${cardClass}">
                    <div>
                        <div class="ticket-header">
                            <div>
                                <h3 class="table-name">${order.displayTitle}</h3>
                                ${order.badgeHtml}
                            </div>
                            <div style="text-align: right;">
                                <span class="order-time">⏰ ${timeStr}</span>
                                <div style="font-size: 12px; margin-top: 4px; ${timeColor}">${waitTimeDisplay}</div>
                            </div>
                        </div>
                        <div class="items-container">
                            ${itemsHtml}
                        </div>
                    </div>
                    <div>
                        ${items.length > 0 ? orderActionBtn : ''}
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        async function updateItemStatus(orderId, itemIndex, newStatus) {
            try {
                const order = activeOrders.find(o => o.id === orderId);
                let items = order.items;
                items[itemIndex].status = newStatus;

                let allServed = true;
                let hasNew = false;
                items.forEach(i => {
                    if (i.status !== 'done' && i.status !== 'served') allServed = false;
                    if (i.status === 'new') hasNew = true;
                });

                let nextDbStatus = 'preparing';
                if (allServed) nextDbStatus = 'served'; 
                else if (hasNew && order.unified_status === 'new') nextDbStatus = 'new';
                
                order.unified_status = nextDbStatus;
                renderOrders(); // Optimistic Update

                if (order.source === 'dine_in') {
                    await supabaseClient.from('table_orders').update({ items: items, order_status: nextDbStatus }).eq('id', orderId);
                } else {
                    // Prepaid mapping
                    let preStatus = nextDbStatus === 'served' ? 'completed' : (nextDbStatus === 'preparing' ? 'processing' : 'pending');
                    await supabaseClient.from('orders').update({ items: items, status: preStatus }).eq('id', orderId);
                }

            } catch (err) { alert("เกิดข้อผิดพลาด: " + err.message); fetchOrders(); }
        }

        async function updateAllItemsStatus(orderId, newStatus, btnElement) {
            try {
                if (btnElement) {
                    btnElement.innerText = "กำลังอัปเดต...";
                    btnElement.className = "btn-large btn-loading";
                    btnElement.disabled = true;
                }

                const order = activeOrders.find(o => o.id === orderId);
                let items = order.items;
                items.forEach(i => i.status = newStatus);

                let nextDbStatus = newStatus === 'done' ? 'served' : 'preparing';

                if (order.source === 'dine_in') {
                    await supabaseClient.from('table_orders').update({ items: items, order_status: nextDbStatus }).eq('id', orderId);
                } else {
                    let preStatus = nextDbStatus === 'served' ? 'completed' : (nextDbStatus === 'preparing' ? 'processing' : 'pending');
                    await supabaseClient.from('orders').update({ items: items, status: preStatus }).eq('id', orderId);
                }
                
                fetchOrders();

            } catch (err) { alert("เกิดข้อผิดพลาด: " + err.message); fetchOrders(); }
        }

        async function updateOrderToServed(orderId, source) {
            if (source === 'dine_in') {
                await supabaseClient.from('table_orders').update({ order_status: 'served' }).eq('id', orderId);
            } else {
                await supabaseClient.from('orders').update({ status: 'completed' }).eq('id', orderId);
            }
            fetchOrders();
        }

        // ==================== AUTH GUARD ====================
        let authCheckTimer = null;
        
        async function verifyStaffSession() {
            if (!VENDOR_ID) {
                forceLogout("ไม่พบรหัสร้านค้า");
                return false;
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('bypass_auth') === 'true') return true; 

            const sessionRaw = localStorage.getItem('staff_session');
            if (!sessionRaw) {
                forceLogout("กรุณาเข้าสู่ระบบก่อนใช้งาน");
                return false;
            }

            try {
                const session = JSON.parse(sessionRaw);
                if (session.role !== 'kitchen' && session.role !== 'cashier') {
                    forceLogout("คุณไม่มีสิทธิ์เข้าถึงหน้านี้");
                    return false;
                }
                
                let query = supabaseClient.from('branches').select('cashier_pin, kitchen_pin').eq('merchant_id', session.vid);
                if (session.bid && session.bid !== 'null') query = query.eq('id', session.bid);
                else query = query.eq('branch_name', 'สาขาหลัก');

                const { data, error } = await query.single();
                
                let isValid = false;
                if (!error && data) {
                    if (session.role === 'kitchen' && data.kitchen_pin === session.pin) isValid = true;
                    if (session.role === 'cashier' && data.cashier_pin === session.pin) isValid = true;
                }

                if (!isValid) {
                    forceLogout("รหัสผ่านถูกเปลี่ยนแปลง กรุณาเข้าสู่ระบบใหม่");
                    return false;
                }

                if (!authCheckTimer) {
                    authCheckTimer = setInterval(verifyStaffSession, 5000);
                }
                return true;

            } catch (e) {
                forceLogout("ข้อมูลเซสชันไม่ถูกต้อง");
                return false;
            }
        }

        function forceLogout(msg) {
            alert(msg);
            localStorage.removeItem('staff_session');
            let loginUrl = `staff-login.html?vid=${VENDOR_ID}`;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('bid') && urlParams.get('bid') !== 'null') loginUrl += `&bid=${urlParams.get('bid')}`;
            window.location.href = loginUrl;
        }

        window.onload = async () => {
            await verifyStaffSession();
        };
    </script>
</body>
</html>
