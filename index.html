<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเปิดร้านค้า</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; padding: 15px; text-align: center; background-color: #f0f2f5; margin: 0; color: #333; }
        
        .header-title { font-weight: 600; font-size: 22px; color: #1e293b; margin-top: 10px; margin-bottom: 5px; }
        .header-subtitle { font-size: 14px; color: #64748b; margin-bottom: 20px; }

        .card { background: white; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 440px; margin: 0 auto; }
        
        .profile-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        img#profileImg { width: 100px; height: 100px; border-radius: 50%; display: none; object-fit: cover; border: 4px solid #06C755; box-shadow: 0 4px 10px rgba(6,199,85,0.2); margin-bottom: 15px; }
        #displayName { font-weight: 600; font-size: 16px; color: #1e293b; background: #f8fafc; padding: 8px 20px; border-radius: 20px; margin: 0; border: 1px solid #e2e8f0; }
        
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #475569; font-weight: 500; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; box-sizing: border-box; transition: border-color 0.3s; font-family: 'Prompt', sans-serif; }
        input:focus { outline: none; border-color: #06C755; box-shadow: 0 0 0 3px rgba(6,199,85,0.1); }
        
        .plans-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; text-align: left; }
        .plan-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.2s ease; background: white; position: relative; overflow: hidden; }
        .plan-card:hover { border-color: #94a3b8; }
        .plan-card.active { border-color: #06C755; background: #f0fdf4; box-shadow: 0 4px 15px rgba(6,199,85,0.1); }
        .plan-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .plan-name { font-weight: 600; font-size: 16px; color: #1e293b; }
        .plan-price { font-weight: 600; font-size: 18px; color: #06C755; }
        .plan-desc { font-size: 13px; color: #64748b; margin-top: 5px; line-height: 1.4; }
        .plan-tag { background: #1e293b; color: white; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 12px; position: absolute; top: -2px; right: 15px; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; border-top-left-radius: 0; border-top-right-radius: 0;}
        .plan-card.active .plan-tag { background: #06C755; }

        button { background-color: #06C755; color: white; border: none; padding: 16px 20px; font-size: 16px; font-weight: 600; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 10px; transition: background-color 0.3s; font-family: 'Prompt', sans-serif; box-shadow: 0 4px 10px rgba(6,199,85,0.3); }
        button:hover { background-color: #05a044; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="header-title">X-Digital Food POS</h2>
        <p class="header-subtitle">ระบบจัดการร้านอาหารที่ง่ายที่สุด</p>
        
        <div class="profile-container">
            <img id="profileImg" src="" alt="Profile">
            <p id="displayName">⏳ กำลังเชื่อมต่อ LINE...</p>
        </div>
        
        <div class="input-group">
            <label>ชื่อร้านอาหาร (สำหรับแสดงให้ลูกค้าเห็น)</label>
            <input type="text" id="storeName" placeholder="เช่น ก๋วยเตี๋ยวเจ๊ปุ๊ก" required>
        </div>
        <div class="input-group">
            <label>เบอร์โทรศัพท์ (สำหรับระบบติดต่อ)</label>
            <input type="tel" id="phoneNumber" placeholder="เช่น 0812345678" required>
        </div>
        <div class="input-group">
            <label>เบอร์พร้อมเพย์ หรือ เลขบัญชีรับเงิน (สามารถแก้ไขทีหลังได้)</label>
            <input type="text" id="promptpayNumber" placeholder="เช่น 0812345678 หรือ เลขบัญชี" required>
        </div>

        <div class="input-group">
            <label>เลือกแพ็กเกจการใช้งาน</label>
            <div class="plans-container" id="plansContainer"></div>
        </div>
        
        <button id="registerBtn" onclick="registerVendor()" disabled>ยืนยันลงทะเบียน</button>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        let lineData = {};
        let selectedPlan = CONFIG.pricingPlans[0]; 
        
        // อ่านค่าผู้แนะนำจาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('ref') || null;

        function renderPricingPlans() {
            const container = document.getElementById('plansContainer');
            let html = '';
            CONFIG.pricingPlans.forEach((plan, index) => {
                const isActive = index === 0 ? 'active' : '';
                const priceText = plan.price === 0 ? 'ฟรี' : `฿${plan.price}`;
                const tagHtml = plan.tag ? `<span class="plan-tag">${plan.tag}</span>` : '';
                html += `
                    <div class="plan-card ${isActive}" id="plan-${plan.id}" onclick="selectPlan('${plan.id}')">
                        ${tagHtml}
                        <div class="plan-header" style="margin-top: ${plan.tag ? '10px' : '0'};">
                            <span class="plan-name">${plan.name}</span>
                            <span class="plan-price">${priceText}</span>
                        </div>
                        <div class="plan-desc">${plan.desc} <br> <span style="color:#06C755; font-weight:500;">(อายุการใช้งาน ${plan.days} วัน)</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectPlan(planId) {
            const plan = CONFIG.pricingPlans.find(p => p.id === planId);
            if (!plan) return;
            selectedPlan = plan;
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`plan-${planId}`).classList.add('active');
        }

        async function initializeLiff() {
            renderPricingPlans();
            try {
                await liff.init({ liffId: CONFIG.liffIdRegister });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineData = { uid: profile.userId, name: profile.displayName, pic: profile.pictureUrl };
                    
                    const { data } = await supabaseClient.from('vendors').select('id').eq('line_owner_uid', lineData.uid).single();
                    if (data) {
                        alert("คุณเคยลงทะเบียนแล้ว ระบบจะพาไปหน้าจัดการร้านค้า");
                        window.location.href = "dashboard.html"; 
                        return;
                    }

                    if (lineData.pic) {
                        document.getElementById('profileImg').src = lineData.pic;
                        document.getElementById('profileImg').style.display = 'inline-block';
                    }
                    document.getElementById('displayName').innerText = `สวัสดีคุณ ${lineData.name}`;
                    document.getElementById('registerBtn').disabled = false;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Init Error: ", err);
                document.getElementById('displayName').innerText = "เกิดข้อผิดพลาด กรุณาเปิดผ่านแอป LINE";
            }
        }

        // ==================== ระบบสร้างรหัสร้านค้า (Vendor ID Generator) ====================
        async function generateVendorId() {
            const now = new Date();
            const yearStr = (now.getFullYear() + 543).toString().slice(-2); // ปี พ.ศ. สองตัวท้าย
            const monthStr = ('0' + (now.getMonth() + 1)).slice(-2); // เดือน สองตัว
            const prefix = `NPX${yearStr}${monthStr}-`;

            // ค้นหารหัสล่าสุดในเดือนนี้จากฐานข้อมูล
            const { data, error } = await supabaseClient
                .from('vendors')
                .select('id')
                .like('id', `${prefix}%`)
                .order('created_at', { ascending: false })
                .limit(1);

            let nextNumber = 1;
            if (data && data.length > 0) {
                // เอารหัสล่าสุดมาตัดเอาแค่ตัวเลข 4 หลักท้าย แล้ว +1
                const lastId = data[0].id;
                const lastNumberStr = lastId.split('-')[1];
                if (lastNumberStr) {
                    nextNumber = parseInt(lastNumberStr) + 1;
                }
            }

            // จัดรูปแบบให้เป็น 0001, 0002 ...
            const sequenceStr = ('0000' + nextNumber).slice(-4);
            return `${prefix}${sequenceStr}`;
        }

        async function registerVendor() {
            const storeName = document.getElementById('storeName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const promptpay = document.getElementById('promptpayNumber').value.trim(); 

            if (!storeName || !phoneNumber || !promptpay) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน"); return;
            }

            const btn = document.getElementById('registerBtn');
            btn.innerText = "⏳ กำลังสร้างร้านค้า..."; btn.disabled = true;

            const expiresAt = new Date();
            expiresAt.setDate(expiresAt.getDate() + selectedPlan.days);
            
            // สร้าง ID ใหม่
            const newVendorId = await generateVendorId();

            // บันทึกลง Supabase พร้อมรหัสร้านแบบใหม่!
            const { data, error } = await supabaseClient
                .from('vendors')
                .insert([
                    { 
                        id: newVendorId, // <=== ใช้รหัสใหม่ที่สร้างขึ้น
                        line_owner_uid: lineData.uid, 
                        line_display_name: lineData.name,
                        line_picture_url: lineData.pic,
                        name: storeName,
                        phone: phoneNumber,
                        promptpay_number: promptpay,
                        is_open: false,
                        slip_check_mode: selectedPlan.mode,
                        subscription_plan: selectedPlan.id,
                        subscription_days: selectedPlan.days,
                        subscription_expires_at: expiresAt.toISOString(),
                        is_subscription_active: true,
                        referrer_id: referrerId, 
                        wallet_balance: 0,
                        slip_quota: selectedPlan.quota || 0
                    }
                ])
                .select();

            if (error) {
                alert("เกิดข้อผิดพลาด: " + error.message);
                btn.innerText = "ลองใหม่อีกครั้ง"; btn.disabled = false;
            } else {
                alert(`ลงทะเบียนร้านค้าสำเร็จ!\nรหัสร้านของคุณคือ: ${newVendorId}\nแพ็กเกจ: ${selectedPlan.name}`);
                
                // ยิงไปแจ้ง GAS ให้เก็บลง Google Sheet และแจ้งแอดมินด้วยรหัสใหม่
                try {
                    await fetch(CONFIG.gasWebhookUrl, {
                        method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: 'register_vendor', vendor_id: newVendorId, store_name: storeName, owner_uid: lineData.uid, display_name: lineData.name, plan: selectedPlan.name, expires_at: expiresAt.toLocaleDateString('th-TH') })
                    });
                } catch(e) {}

                window.location.href = "dashboard.html"; 
            }
        }
        window.onload = initializeLiff;
    </script>
</body>
</html>
