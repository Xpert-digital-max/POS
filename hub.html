<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์รวมปฏิบัติการพนักงาน</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f6f8; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .hub-container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; color: #1a237e; font-size: 24px; }
        .hub-grid { display: flex; flex-direction: column; gap: 15px; }
        .hub-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; cursor: pointer; text-decoration: none; color: #333; display: block; border: 2px solid transparent; transition: 0.2s;}
        .hub-card:hover { transform: translateY(-3px); border-color: #06C755; }
        .hub-icon { font-size: 40px; margin-bottom: 10px; }
        .hub-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .hub-desc { font-size: 12px; color: #777; }
        .error-box { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #ef9a9a; display: none; }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="header">
            <h1>🏠 หน้าปฏิบัติการพนักงาน</h1>
            <p style="font-size: 13px; color: #666;">คลิกเพื่อเข้าสู่ระบบตามบทบาทหน้าที่</p>
        </div>

        <div id="errorBox" class="error-box">
            ไม่พบข้อมูลร้านค้า (Vendor ID) กรุณาเข้าสู่ระบบผ่านลิงก์ที่ถูกต้อง
        </div>

        <div id="hubMenu" class="hub-grid" style="display: none;">
            <!-- ปุ่มหลัก สำหรับให้พนักงาน Login (ไม่ให้ข้าม Auth) -->
            <a href="#" id="staffLoginBtn" class="hub-card" style="border-bottom: 4px solid #3f51b5; background: #e8eaf6;">
                <div class="hub-icon">👨‍💼</div>
                <div class="hub-title" style="font-size: 20px; color: #3f51b5;">เข้าสู่ระบบพนักงาน (Login)</div>
                <div class="hub-desc">สำหรับแคชเชียร์และห้องครัว (ต้องใช้ PIN)</div>
            </a>

            <!-- ปุ่มรายงานยอดขาย -->
            <a href="#" id="salesReportBtn" class="hub-card" style="border-bottom: 4px solid #00BCD4; background: #e0f7fa;" onclick="checkSalesAccess(event)">
                <div class="hub-icon">📊</div>
                <div class="hub-title" style="font-size: 20px; color: #00838F;">รายงานยอดขาย</div>
                <div class="hub-desc">ดูยอดขาย เงินสด เงินโอน และเมนูขายดี</div>
            </a>
            
            <p style="text-align: center; font-size: 12px; color: #888; margin-top: 20px;">* ทุกตำแหน่งต้องเข้าสู่ระบบผ่านรหัส PIN</p>
        </div>
    </div>

    <script>
        let VENDOR_ID = null;
        let BASE_PATH = '';

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            VENDOR_ID = params.get('vid');
            
            if (!VENDOR_ID) {
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            // ถ้ามี vid ให้แสดงเมนูและผูกลิงก์
            document.getElementById('hubMenu').style.display = 'flex';
            
            BASE_PATH = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const staffLoginUrl = `${BASE_PATH}/staff-login.html?vid=${VENDOR_ID}`;
            
            document.getElementById('staffLoginBtn').href = staffLoginUrl;
            
            // แจ้งเตือนเรื่องความปลอดภัย
            console.log("Security Mode: Strict Authorization Enforced. All roles must login via staff-login.");
        };

        function checkSalesAccess(event) {
            event.preventDefault();
            
            if (!VENDOR_ID) {
                alert("ไม่พบข้อมูลร้านค้า");
                return;
            }

            const sessionRaw = localStorage.getItem('staff_session');
            
            // 1. ถ้ายังไม่ได้ล็อกอิน ให้พุ่งไปหน้า Login พร้อมตัวแปร next=sales
            if (!sessionRaw) {
                window.location.href = `${BASE_PATH}/staff-login.html?vid=${VENDOR_ID}&next=sales`;
                return;
            }
            
            try {
                const session = JSON.parse(sessionRaw);
                
                // 2. เช็คว่าล็อกอินร้านเดียวกันหรือไม่
                if (session.vid !== VENDOR_ID) {
                    alert("เซสชันไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่");
                    window.location.href = `${BASE_PATH}/staff-login.html?vid=${VENDOR_ID}&next=sales`;
                    return;
                }
                
                // 3. เช็ค Role ครัวห้ามเข้า
                if (session.role === 'kitchen') {
                    alert("คุณไม่มีสิทธิ์เข้าถึงหน้ารายงานยอดขาย (เฉพาะแคชเชียร์)");
                    return;
                }
                
                // 4. ถ้าเป็นแคชเชียร์ ให้พาไปหน้า Sales Dashboard พร้อมแนบ bid (ถ้ามี)
                if (session.role === 'cashier') {
                    let salesUrl = `${BASE_PATH}/sales-dashboard.html?vid=${VENDOR_ID}`;
                    if (session.bid && session.bid !== 'null') {
                        salesUrl += `&bid=${session.bid}`;
                    }
                    window.location.href = salesUrl;
                } else {
                     alert("สิทธิ์ไม่ถูกต้อง");
                }
                
            } catch (e) {
                console.error("Session parse error", e);
                window.location.href = `${BASE_PATH}/staff-login.html?vid=${VENDOR_ID}&next=sales`;
            }
        }
    </script>
</body>
</html>
