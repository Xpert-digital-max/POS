<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้านค้า</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f6f8; }
        .header { background: #06C755; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .store-info { display: flex; align-items: center; gap: 10px; }
        .store-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; object-fit: cover;}
        .tab-menu { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-size: 15px; font-weight: bold; color: #777; }
        .tab-btn.active { color: #06C755; border-bottom: 3px solid #06C755; }
        .content { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px;}
        .cat-chip { display: inline-flex; align-items: center; gap: 6px; background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin: 4px; border: 1px solid #c8e6c9; }
        .cat-chip button { background: none; border: none; cursor: pointer; font-size: 12px; color: #666; padding: 0 2px; }
        .sub-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .sub-active { background: #e8f5e9; color: #2e7d32; }
        .sub-expired { background: #ffebee; color: #c62828; }
        .section-divider { border-top: 1px dashed #ccc; margin: 15px 0; padding-top: 15px; }
        .billing-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #555; }
        .billing-total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #bcdcff; font-weight: bold; font-size: 16px; color: #0d47a1; }
        .admin-bank-box { background: #e3f2fd; padding: 10px; border-radius: 6px; border: 1px dashed #2196F3; font-size: 13px; color: #0d47a1; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <!-- Modal ถอนเงิน / Affiliate / QR (คงเดิม) -->
    <div id="withdrawModal" style="display: none; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 400; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 400px; border-radius: 12px; padding: 20px; box-sizing: border-box;">
            <h3 style="margin-top: 0; color: #ff9800;">💸 แจ้งถอนเงิน</h3>
            <select id="withdrawType" onchange="updateWithdrawInfo()" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px;"><option value="cash">ถอนเป็นเงินสดเข้าบัญชี</option><option value="package">ใช้ชำระเป็นค่าแพ็กเกจระบบ</option></select>
            <div id="withdrawInfo" style="background: #fff8e1; padding: 10px; border-radius: 6px; font-size: 12px; color: #e65100; margin-bottom: 15px; border: 1px dashed #ffb74d;"></div>
            <input type="number" id="withdrawAmount" placeholder="ระบุจำนวนเงิน" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeWithdrawModal()" style="flex: 1; padding: 12px; border: none; border-radius: 6px; background: #eee; font-weight: bold; cursor: pointer;">ยกเลิก</button>
                <button onclick="submitWithdraw()" id="submitWithdrawBtn" style="flex: 2; padding: 12px; border: none; border-radius: 6px; background: #ff9800; color: white; font-weight: bold; cursor: pointer;">ยืนยัน</button>
            </div>
        </div>
    </div>
    <!-- ... (ข้ามโค้ด Modal เดิมที่ไม่ได้แก้) ... -->

    <!-- แถบด้านบน -->
    <div class="header">
        <div class="store-info">
            <img id="storeLogo" src="https://via.placeholder.com/40">
            <h3 id="storeName" style="margin: 0;">กำลังโหลด...</h3>
        </div>
        <div style="text-align: right;">
            <label style="font-size: 12px; display: block; margin-bottom: 3px;">สถานะร้าน</label>
            <button id="storeStatusBtn" onclick="toggleStoreStatus()" style="background: #ff4d4f; color: white; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;">🔴 ปิดร้าน</button>
        </div>
    </div>

    <!-- แถบเมนู -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('orders')">📋 ออเดอร์</button>
        <button class="tab-btn" onclick="switchTab('menu')">🍔 เมนู</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ ตั้งค่า</button>
    </div>

    <div class="content">
        <!-- 1. หน้าออเดอร์ -->
        <div id="orders" class="tab-content active">
            <h2 style="display: flex; justify-content: space-between; align-items: center;">คิวรอทำ <button onclick="loadOrders()" style="font-size: 14px; padding: 6px 12px; background: #eee; border: none; border-radius: 5px; cursor: pointer;">🔄 รีเฟรช</button></h2>
            <div id="orderList"><p style="text-align: center; color: #888;">กำลังโหลด...</p></div>
        </div>

        <!-- 2. หน้าเมนู -->
        <div id="menu" class="tab-content">
            <!-- (ใช้โค้ดเมนูของเดิมที่คุณเพิ่งก๊อปปี้ไปก่อนหน้านี้ได้เลยครับ โค้ดเดิมสมบูรณ์แล้ว) -->
            <div class="card" style="border-left: 4px solid #06C755;">
                <h3 style="margin-top: 0;">🏷️ หมวดหมู่สินค้า</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="newCategoryName" placeholder="เช่น อาหารจานด่วน" style="flex: 1; padding: 9px; border: 1px solid #ddd; border-radius: 6px;">
                    <button onclick="saveCategory()" id="saveCatBtn" style="background: #06C755; color: white; border: none; padding: 9px 15px; border-radius: 6px; font-weight: bold;">+ เพิ่ม</button>
                </div>
                <div id="categoryChips">กำลังโหลดหมวดหมู่...</div>
            </div>

            <div class="card" style="background: #f9f9f9; border: 1px dashed #ccc;">
                <h3 style="margin-top: 0;" id="formTitle">🍔 เพิ่มเมนูใหม่</h3>
                <input type="text" id="menuName" placeholder="ชื่อเมนู" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
                <select id="menuCategorySelect" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;"><option value="">-- ไม่ระบุหมวดหมู่ --</option></select>
                <input type="number" id="menuPrice" placeholder="ราคา (บาท)" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
                <label style="font-size: 13px; font-weight: bold; color: #00BCD4;">ตัวเลือกย่อย (คั่นด้วย ; และ ,)</label>
                <input type="text" id="menuOptions" placeholder="เช่น ความหวาน:หวานมาก,หวานน้อย" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #b2ebf2; border-radius: 6px; box-sizing:border-box;">
                <input type="file" id="menuImage" accept="image/*" style="margin-bottom: 10px;">
                <button onclick="addNewMenu()" id="saveMenuBtn" style="background: #06C755; color: white; border: none; padding: 11px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold;">💾 บันทึกเมนูใหม่</button>
                <button onclick="resetFormState()" id="cancelEditBtn" style="display: none; background: #eee; color: #555; border: none; padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; margin-top: 6px;">ยกเลิก</button>
            </div>
            <div id="menuList" style="margin-top: 15px;"></div>
        </div>

        <!-- 3. หน้าตั้งค่า (อัปเดต Bank & Promptpay) -->
        <div id="settings" class="tab-content">
            
            <!-- แพ็กเกจและบิลลิ่งรอบเดือนนี้ -->
            <div class="card" style="border-left: 4px solid #2196F3; background: #f0f7ff;">
                <h3 style="margin-top: 0; color: #0d47a1;">🧾 แพ็กเกจและบิลลิ่งรอบเดือนนี้</h3>
                <!-- ... โชว์ยอดบิลตามเดิม ... -->
                
                <div class="section-divider"></div>
                <label style="font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 4px;">💳 ต่ออายุแพ็กเกจ / ซื้อโควต้า</label>
                <select id="renewPlanSelect" onchange="updateRenewQr()" style="width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #bcdcff; border-radius: 6px;"></select>
                
                <!-- กล่องจ่ายเงินให้แอดมิน รองรับ 2 แบบ -->
                <div style="background: white; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; border: 1px solid #e0e0e0;">
                    <p style="margin: 0 0 6px 0; font-size: 13px; font-weight: bold; color: #333;">ชำระค่าบริการ</p>
                    <img id="adminQrImage" src="" style="width: 130px; height: 130px; border: 1px solid #ddd; padding: 4px; border-radius: 6px;">
                    <div id="adminBankInfoBox" class="admin-bank-box"></div>
                    <p id="renewAmountText" style="margin: 6px 0 0 0; font-size: 14px; font-weight: bold; color: #06C755;">ยอดชำระ: ฿0</p>
                </div>
                
                <label style="font-size: 13px; font-weight: bold; color: #555;">แนบสลิปเพื่อยืนยัน</label>
                <div style="display: flex; gap: 8px; margin-top: 5px;">
                    <input type="file" id="renewSlipImage" accept="image/*" style="flex: 1; padding: 5px;">
                    <button onclick="verifyAndRenewSubscription(this)" id="renewBtn" style="background: #2196F3; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold;">ยืนยัน</button>
                </div>
            </div>

            <!-- ข้อมูลร้านค้าทั่วไป (อัปเดตช่องทางรับเงิน) -->
            <div class="card" style="background: #f9f9f9; border: 1px dashed #ccc;">
                <h3 style="margin-top: 0; color: #333;">⚙️ ตั้งค่าร้านค้า (สาขาหลัก)</h3>
                <label style="font-size: 13px; font-weight: bold; color: #555;">รูปโลโก้ร้าน</label>
                <input type="file" id="settingStoreLogo" accept="image/*" style="margin-bottom: 15px; width: 100%; margin-top: 5px;">
                <label style="font-size: 13px; font-weight: bold; color: #555;">ชื่อร้านอาหาร</label>
                <input type="text" id="settingStoreName" style="width: 100%; padding: 10px; margin-bottom: 15px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
                <label style="font-size: 13px; font-weight: bold; color: #555;">เบอร์โทรศัพท์ติดต่อ</label>
                <input type="tel" id="settingPhone" style="width: 100%; padding: 10px; margin-bottom: 15px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
                
                <div class="section-divider"></div>
                <h3 style="margin-top: 0; color: #00BCD4;">💳 ช่องทางรับเงินลูกค้า</h3>
                <select id="settingPaymentType" onchange="togglePaymentInputs()" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="promptpay">สร้าง QR Code พร้อมเพย์อัตโนมัติ</option>
                    <option value="bank">โอนเข้าบัญชีธนาคาร (โชว์เลขบัญชี)</option>
                </select>
                
                <div id="divPromptpay">
                    <label style="font-size: 13px; font-weight: bold; color: #555;">เบอร์พร้อมเพย์ หรือ เลข ปชช.</label>
                    <input type="text" id="settingPromptpay" placeholder="เช่น 0812345678" style="width: 100%; padding: 10px; margin-bottom: 15px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
                </div>
                <div id="divBank" style="display: none;">
                    <label style="font-size: 13px; font-weight: bold; color: #555;">รายละเอียดบัญชี (ชื่อธนาคาร สาขา เลขบัญชี ชื่อบัญชี)</label>
                    <textarea id="settingBankInfo" placeholder="เช่น ธ.กสิกรไทย สาขา... เลขบัญชี 123-4-56789-0 ชื่อ นายใจดี" style="width: 100%; padding: 10px; margin-bottom: 15px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; resize: none;" rows="3"></textarea>
                </div>
                
                <button onclick="updateStoreSettings(this)" id="saveSettingsBtn" style="background: #06C755; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;">💾 บันทึกการตั้งค่า</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        let vendorData = null;

        // ... ฟังก์ชันสลับ Tab และ Load Data ขอย่อไว้เพราะใช้ของเดิม ...
        function switchTab(tabId) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); document.getElementById(tabId).classList.add('active'); event.target.classList.add('active'); }

        async function initDashboard() {
            try { await liff.init({ liffId: CONFIG.liffIdDashboard }); if (liff.isLoggedIn()) { loadVendorData(liff.getDecodedIDToken().sub); } else { liff.login(); } } catch (err) { }
        }

        async function loadVendorData(uid) {
            const { data, error } = await supabaseClient.from('vendors').select('*').eq('line_owner_uid', uid).single(); 
            if (!data) return; vendorData = data;
            
            document.getElementById('storeName').innerText = vendorData.name;
            if (vendorData.line_picture_url) document.getElementById('storeLogo').src = vendorData.line_picture_url;

            // อัปเดตฟอร์มการตั้งค่า
            document.getElementById('settingStoreName').value = vendorData.name;
            document.getElementById('settingPhone').value = vendorData.phone || '';
            document.getElementById('settingPaymentType').value = vendorData.payment_type || 'promptpay';
            document.getElementById('settingPromptpay').value = vendorData.promptpay_number || '';
            document.getElementById('settingBankInfo').value = vendorData.bank_info || '';
            togglePaymentInputs();

            loadOrders(); // รีโหลดคิวงาน
            renderSubscriptionInfo(); // รีโหลด QR ของแอดมิน
        }

        function togglePaymentInputs() {
            const type = document.getElementById('settingPaymentType').value;
            if (type === 'promptpay') { document.getElementById('divPromptpay').style.display = 'block'; document.getElementById('divBank').style.display = 'none'; } 
            else { document.getElementById('divPromptpay').style.display = 'none'; document.getElementById('divBank').style.display = 'block'; }
        }

        async function updateStoreSettings(btn) {
            const name = document.getElementById('settingStoreName').value.trim(); 
            const phone = document.getElementById('settingPhone').value.trim(); 
            const payType = document.getElementById('settingPaymentType').value;
            const promptpay = document.getElementById('settingPromptpay').value.trim(); 
            const bankInfo = document.getElementById('settingBankInfo').value.trim();
            
            if (!name) return alert("กรุณากรอกชื่อร้าน");
            btn.innerText = "⏳ กำลังบันทึก..."; btn.disabled = true;

            await supabaseClient.from('vendors').update({ 
                name: name, phone: phone, payment_type: payType, promptpay_number: promptpay, bank_info: bankInfo 
            }).eq('id', vendorData.id);
            
            alert("อัปเดตข้อมูลร้านค้าเรียบร้อยแล้ว!");
            btn.innerText = "💾 บันทึกการตั้งค่า"; btn.disabled = false;
        }

        // ==================== ระบบออเดอร์ (แก้ปุ่มหน่วง + ยิง Flex กลับหาลูกค้า) ====================
        async function loadOrders() {
            if (!vendorData) return; const orderListDiv = document.getElementById('orderList'); orderListDiv.innerHTML = '<p style="text-align: center; color: #888;">กำลังโหลด...</p>';
            const { data } = await supabaseClient.from('orders').select('*').eq('vendor_id', vendorData.id).in('status', ['pending', 'processing']).order('created_at', { ascending: true });
            if (!data || data.length === 0) { orderListDiv.innerHTML = '<p style="text-align: center; color: #888;">ยังไม่มีออเดอร์เข้าในขณะนี้</p>'; return; }
            
            let html = '';
            data.forEach((order, index) => {
                const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items; 
                let itemsHtml = ''; const itemsArray = Array.isArray(items) ? items : Object.values(items);
                itemsArray.forEach(item => {
                    let optStr = item.option ? `<br><small style="color:#00BCD4;">👉 ${item.option}</small>` : '';
                    let noteStr = item.note ? `<br><small style="color:#ff4d4f;">📝 ${item.note}</small>` : '';
                    itemsHtml += `<li style="font-size: 15px; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 5px;"><b>${item.qty}x</b> ${item.name} ${optStr} ${noteStr}</li>`;
                });
                const d = new Date(order.created_at); const orderTime = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); 
                const orderRef = `${d.getFullYear().toString().slice(-2)}${('0'+(d.getMonth()+1)).slice(-2)}${('0'+d.getDate()).slice(-2)}-${order.id.substring(0,4).toUpperCase()}`; 
                const queueNum = index + 1; const custUid = order.customer_uid || '';
                
                let statusBadge = order.status === 'pending' ? '<span style="background: #fff3cd; color: #856404; padding: 3px 8px; border-radius: 12px; font-size: 12px;">รอยืนยันสลิป</span>' : '<span style="background: #cce5ff; color: #004085; padding: 3px 8px; border-radius: 12px; font-size: 12px;">กำลังทำอาหาร 🍳</span>'; 
                
                // สังเกตตรงปุ่ม: เติม this เข้าไปเพื่อให้รู้ว่าปุ่มไหนโดนกด จะได้โชว์ "กำลังส่ง..."
                let actionButtons = '';
                if (order.status === 'pending') { 
                    actionButtons = `<button onclick="updateOrderStatus('${order.id}', 'processing', '${custUid}', '${orderRef}', ${queueNum}, this)" style="background: #06C755; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1;">✅ รับออเดอร์</button> <button onclick="updateOrderStatus('${order.id}', 'rejected', '${custUid}', '${orderRef}', ${queueNum}, this)" style="background: #ff4d4f; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1;">❌ ปฏิเสธ</button>`; 
                } 
                else if (order.status === 'processing') { 
                    actionButtons = `<button onclick="updateOrderStatus('${order.id}', 'completed', '${custUid}', '${orderRef}', ${queueNum}, this)" style="background: #2196F3; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%;">🏁 อาหารเสร็จแล้ว</button>`; 
                }
                
                html += `<div class="card" style="border-left: 4px solid #06C755;"><div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><h3 style="margin: 0; display:flex; flex-direction:column;">คิวที่ ${queueNum} <span style="font-size: 12px; color: #888; font-weight: normal; margin-top:3px;">อ้างอิง: ${orderRef} • ${orderTime}</span></h3><div>${statusBadge}</div></div><div style="display: flex; gap: 15px; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 8px;"><div style="flex: 1;"><ul style="margin: 0; padding-left: 20px; color: #333; list-style-type: square;">${itemsHtml}</ul><p style="margin: 10px 0 0 0; font-weight: bold; color: #06C755;">ยอดโอน: ฿${order.total_price}</p></div><div style="text-align: center;"><a href="${order.slip_image_url}" target="_blank"><img src="${order.slip_image_url}" style="width: 70px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;"></a></div></div><div style="display: flex; gap: 10px;">${actionButtons}</div></div>`;
            }); 
            orderListDiv.innerHTML = html;
        }

        async function updateOrderStatus(orderId, newStatus, customerUid, orderRef, queueNum, btnElement) {
            let confirmMsg = newStatus === 'processing' ? "ตรวจสอบสลิปถูกต้อง และรับคิวนี้ใช่หรือไม่?" : newStatus === 'completed' ? "อาหารเสร็จแล้ว ส่งมอบเรียบร้อยใช่หรือไม่?" : "ต้องการยกเลิกออเดอร์นี้ใช่หรือไม่?";
            if (!confirm(confirmMsg)) return;

            // เปลี่ยนสถานะปุ่มกันแม่ค้ากดเบิ้ล
            const originalText = btnElement.innerText;
            btnElement.innerText = "⏳ กำลังส่งข้อมูล...";
            btnElement.disabled = true;

            // สร้างก้อน Flex Message ส่งไป GAS
            let flexMessageObj = {
                "type": "flex", "altText": newStatus === 'completed' ? `อาหารเสร็จแล้ว! (คิวที่ ${queueNum})` : `อัปเดตสถานะออเดอร์ (คิวที่ ${queueNum})`,
                "contents": {
                    "type": "bubble",
                    "header": { "type": "box", "layout": "vertical", "backgroundColor": newStatus === 'completed' ? "#2196F3" : newStatus === 'rejected' ? "#ff4d4f" : "#06C755", "contents": [{ "type": "text", "text": newStatus === 'completed' ? "🏁 อาหารเสร็จแล้ว!" : newStatus === 'rejected' ? "❌ ยกเลิกออเดอร์" : "👨‍🍳 ร้านรับออเดอร์แล้ว!", "color": "#FFFFFF", "weight": "bold", "size": "lg" }] },
                    "body": { "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                        { "type": "text", "text": vendorData.name, "weight": "bold", "size": "xl", "color": "#333333" },
                        { "type": "separator", "margin": "md" },
                        { "type": "box", "layout": "horizontal", "margin": "md", "contents": [ { "type": "text", "text": "คิวที่", "size": "md", "color": "#555555", "flex": 1, "gravity": "center" }, { "type": "text", "text": String(queueNum), "size": "4xl", "color": newStatus === 'rejected' ? "#ff4d4f" : "#06C755", "align": "end", "weight": "bold" } ]},
                        { "type": "separator", "margin": "md" },
                        { "type": "text", "text": newStatus === 'processing' ? "กำลังเร่งเตรียมอาหารให้ครับ กรุณารอสักครู่" : newStatus === 'completed' ? "มารับอาหารที่หน้าร้านได้เลยครับ ขอบคุณที่ใช้บริการ!" : "ขออภัยครับ ออเดอร์ของคุณถูกยกเลิก กรุณาติดต่อร้านค้า", "size": "sm", "color": "#666666", "wrap": true, "margin": "md" }
                    ]}
                }
            };

            await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId);
            
            // ส่งข้อมูลแจ้งเตือน (แก้ CORS Policy ให้แล้วด้วย text/plain)
            if (customerUid && customerUid !== '') { 
                try { 
                    await fetch(CONFIG.gasWebhookUrl, { 
                        method: 'POST', 
                        redirect: 'follow', // ป้องกัน CORS Drop
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: 'notify_customer', vendor_id: vendorData.id, uid: customerUid, flexMessage: flexMessageObj }) 
                    }); 
                } catch (e) { console.log(e); } 
            }
            loadOrders(); // โหลดใหม่เพื่อให้ปุ่มกลับมาเป็นปกติ
        }

        // ==================== ระบบ QR แอดมิน (เปลี่ยนเป็นบัญชีธนาคารได้) ====================
        function updateRenewQr() {
            const opt = document.getElementById('renewPlanSelect').options[document.getElementById('renewPlanSelect').selectedIndex];
            if (!opt) return;
            const price = opt.getAttribute('data-price');
            document.getElementById('renewAmountText').innerText = `ยอดชำระ: ฿${price}`;

            if (CONFIG.adminPaymentType === 'bank') {
                document.getElementById('adminQrImage').style.display = 'none';
                document.getElementById('adminBankInfoBox').innerHTML = `<b>โอนเข้าบัญชี:</b><br>${CONFIG.adminBankInfo}<br>เลขบัญชี: ${CONFIG.adminPromptpay}`;
                document.getElementById('adminBankInfoBox').style.display = 'block';
            } else {
                document.getElementById('adminQrImage').src = `https://promptpay.io/${CONFIG.adminPromptpay}/${price}.png`;
                document.getElementById('adminQrImage').style.display = 'inline-block';
                document.getElementById('adminBankInfoBox').style.display = 'none';
            }
        }
        function renderSubscriptionInfo() {
            // โหลดข้อมูลลง Select
            const renewSelect = document.getElementById('renewPlanSelect'); let optionsHtml = '';
            CONFIG.pricingPlans.filter(p => p.price > 0).forEach(p => { optionsHtml += `<option value="${p.id}" data-price="${p.price}" data-days="${p.days}" data-quota="${p.quota}">${p.name} - ฿${p.price}</option>`; });
            renewSelect.innerHTML = optionsHtml; updateRenewQr();
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
