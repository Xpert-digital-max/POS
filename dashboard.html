<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้านค้า</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f6f8; }
        .header { background: #06C755; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .store-info { display: flex; align-items: center; gap: 10px; }
        .store-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; object-fit: cover;}
        .tab-menu { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-size: 15px; font-weight: bold; color: #777; }
        .tab-btn.active { color: #06C755; border-bottom: 3px solid #06C755; }
        .content { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px;}
        .cat-chip { display: inline-flex; align-items: center; gap: 6px; background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin: 4px; border: 1px solid #c8e6c9; }
        .cat-chip button { background: none; border: none; cursor: pointer; font-size: 12px; color: #666; padding: 0 2px; }
        .sub-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .sub-active { background: #e8f5e9; color: #2e7d32; }
        .sub-expired { background: #ffebee; color: #c62828; }
        .section-divider { border-top: 1px dashed #ccc; margin: 15px 0; padding-top: 15px; }
    </style>
</head>
<body>

    <!-- Modal แจ้งถอนเงิน และ Modal QR Code ขอละไว้ในหน้า UI (โค้ดยังอยู่ครบ) -->
    <div id="withdrawModal" style="display: none; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 400; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 400px; border-radius: 12px; padding: 20px; box-sizing: border-box;">
            <h3 style="margin-top: 0; color: #ff9800;">💸 แจ้งถอนเงิน / ชำระค่าแพ็กเกจ</h3>
            <select id="withdrawType" onchange="updateWithdrawInfo()" style="width: 100%; padding: 10px; margin-bottom: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px;">
                <option value="cash">ถอนเป็นเงินสดเข้าพร้อมเพย์</option>
                <option value="package">ใช้ชำระเป็นค่าแพ็กเกจระบบ</option>
            </select>
            <div id="withdrawInfo" style="background: #fff8e1; padding: 10px; border-radius: 6px; font-size: 12px; color: #e65100; margin-bottom: 15px; border: 1px dashed #ffb74d;"></div>
            <input type="number" id="withdrawAmount" placeholder="ระบุจำนวนเงิน" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeWithdrawModal()" style="flex: 1; padding: 12px; border: none; border-radius: 6px; background: #eee; font-weight: bold; cursor: pointer;">ยกเลิก</button>
                <button onclick="submitWithdraw()" id="submitWithdrawBtn" style="flex: 2; padding: 12px; border: none; border-radius: 6px; background: #ff9800; color: white; font-weight: bold; cursor: pointer;">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div id="qrModal" style="display: none; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 400; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 320px; border-radius: 12px; padding: 20px; box-sizing: border-box; text-align: center;">
            <h3 style="margin-top: 0; color: #06C755;">🤝 ให้เพื่อนสแกน QR นี้</h3>
            <img id="affiliateQrImage" src="" style="width: 200px; height: 200px; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <button onclick="closeQrModal()" style="width: 100%; padding: 12px; border: none; border-radius: 6px; background: #eee; font-weight: bold; cursor: pointer;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="customerQrModal" style="display: none; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 400; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 320px; border-radius: 12px; padding: 20px; box-sizing: border-box; text-align: center;">
            <h3 style="margin-top: 0; color: #00BCD4;">🍽️ สแกนเพื่อสั่งอาหาร</h3>
            <img id="customerQrImage" src="" style="width: 200px; height: 200px; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
            <button onclick="downloadCustomerQr()" style="width: 100%; padding: 12px; margin-bottom:10px; border: none; border-radius: 6px; background: #00BCD4; color: white; font-weight: bold; cursor: pointer;">⬇️ บันทึกรูปภาพ</button>
            <button onclick="closeCustomerQrModal()" style="width: 100%; padding: 10px; border: none; border-radius: 6px; background: #eee; font-weight: bold; cursor: pointer;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- แถบด้านบน -->
    <div class="header">
        <div class="store-info">
            <img id="storeLogo" src="https://via.placeholder.com/40">
            <h3 id="storeName" style="margin: 0;">กำลังโหลด...</h3>
        </div>
        <div style="text-align: right;">
            <label style="font-size: 12px; display: block; margin-bottom: 3px;">สถานะร้าน</label>
            <button id="storeStatusBtn" onclick="toggleStoreStatus()" style="background: #ff4d4f; color: white; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;">🔴 ปิดร้าน</button>
        </div>
    </div>

    <!-- แถบเมนู (Tabs) -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('orders')">📋 ออเดอร์</button>
        <button class="tab-btn" onclick="switchTab('menu')">🍔 เมนูอาหาร</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ ตั้งค่า</button>
    </div>

    <div class="content">
        <!-- 1. หน้าออเดอร์ -->
        <div id="orders" class="tab-content active">
            <h2 style="display: flex; justify-content: space-between; align-items: center;">
                คิวรอทำ <button onclick="loadOrders()" style="font-size: 14px; padding: 6px 12px; background: #eee; border: none; border-radius: 5px; cursor: pointer;">🔄 รีเฟรช</button>
            </h2>
            <div id="orderList"><p style="text-align: center; color: #888;">กำลังโหลด...</p></div>
        </div>

        <!-- 2. หน้าจัดการเมนูและหมวดหมู่ -->
        <div id="menu" class="tab-content">
            <div class="card" style="border-left: 4px solid #06C755;">
                <h3 style="margin-top: 0;">🏷️ จัดการหมวดหมู่สินค้า</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="newCategoryName" placeholder="เช่น อาหารจานด่วน" style="flex: 1; padding: 9px; border: 1px solid #ddd; border-radius: 6px;">
                    <button onclick="saveCategory()" id="saveCatBtn" style="background: #06C755; color: white; border: none; padding: 9px 15px; border-radius: 6px; font-weight: bold;">+ เพิ่ม</button>
                </div>
                <div id="categoryChips">กำลังโหลดหมวดหมู่...</div>
            </div>

            <div class="card" style="background: #f9f9f9; border: 1px dashed #ccc;">
                <h3 style="margin-top: 0;" id="formTitle">🍔 เพิ่มเมนูใหม่</h3>
                <label style="font-size: 13px; font-weight: bold; color: #555;">ชื่อเมนู</label>
                <input type="text" id="menuName" placeholder="เช่น ชานมไข่มุก" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing:border-box;">
                
                <label style="font-size: 13px; font-weight: bold; color: #555;">หมวดหมู่</label>
                <select id="menuCategorySelect" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing:border-box;">
                    <option value="">-- ไม่ระบุหมวดหมู่ --</option>
                </select>
                
                <label style="font-size: 13px; font-weight: bold; color: #555;">ราคา (บาท)</label>
                <input type="number" id="menuPrice" placeholder="ราคา (บาท)" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing:border-box;">
                
                <!-- (ใหม่) ช่องใส่ตัวเลือกย่อย -->
                <label style="font-size: 13px; font-weight: bold; color: #00BCD4;">ตัวเลือกย่อย (คั่นด้วยลูกน้ำ ",") - *ถ้ามี</label>
                <input type="text" id="menuOptions" placeholder="เช่น หวานปกติ, หวานน้อย, ไม่หวาน" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #b2ebf2; border-radius: 6px; box-sizing:border-box;">

                <label style="font-size: 13px; font-weight: bold; color: #555;">รูปภาพเมนู</label><br>
                <input type="file" id="menuImage" accept="image/*" style="margin-bottom: 15px; margin-top:5px;">
                
                <button onclick="addNewMenu()" id="saveMenuBtn" style="background: #06C755; color: white; border: none; padding: 11px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold;">💾 บันทึกเมนูใหม่</button>
                <button onclick="resetFormState()" id="cancelEditBtn" style="display: none; background: #eee; color: #555; border: none; padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; margin-top: 6px;">ยกเลิกการแก้ไข</button>
            </div>
            <div id="menuList" style="margin-top: 15px;"><p style="text-align: center; color: #888;">กำลังโหลดเมนู...</p></div>
        </div>

        <!-- 3. หน้าตั้งค่า (รวบรัดโค้ดเดิมไว้ครบ) -->
        <div id="settings" class="tab-content">
            <!-- ลิงก์ร้านค้า -->
            <div class="card" style="border-left: 4px solid #00BCD4; background: #e0f7fa;">
                <h3 style="margin-top: 0; color: #00838F;">🍽️ ช่องทางสั่งอาหารของร้านคุณ</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="text" id="customerLinkText" readonly style="flex: 1; padding: 9px; border: 1px solid #b2ebf2; border-radius: 6px; font-size: 12px;">
                    <button onclick="copyCustomerLink()" style="background: #00838F; color: white; border: none; padding: 9px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">คัดลอก</button>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="shareCustomerFlex()" style="flex: 1; background: #00B900; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold;">📲 ส่งให้ลูกค้า</button>
                    <button onclick="showCustomerQr()" style="flex: 1; background: #00BCD4; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold;">📷 QR Code</button>
                </div>
            </div>
            <!-- ข้อมูลร้านค้าทั่วไป -->
            <div class="card" style="background: #f9f9f9; border: 1px dashed #ccc;">
                <h3 style="margin-top: 0; color: #333;">⚙️ ข้อมูลร้านค้าทั่วไป</h3>
                <input type="text" id="settingStoreName" placeholder="ชื่อร้าน" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing:border-box;">
                <input type="text" id="settingPromptpay" placeholder="พร้อมเพย์ร้าน" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing:border-box;">
                <button onclick="updateStoreSettings()" id="saveSettingsBtn" style="background: #06C755; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-weight: bold;">💾 บันทึกข้อมูลร้านค้า</button>
            </div>
            <!-- ระบบ SaaS (ย่อไว้) -->
            <div id="renewContainer" style="display:none;"></div>
            <div id="topupQuotaContainer" style="display:none;"></div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        let vendorData = null;
        let categories = [];
        let editingMenuId = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function initDashboard() {
            try {
                await liff.init({ liffId: CONFIG.liffIdDashboard });
                if (liff.isLoggedIn()) {
                    loadVendorData(liff.getDecodedIDToken().sub); // ใช้วิธีดึง UID แบบไม่ต้องรอ profile
                } else { liff.login(); }
            } catch (err) { console.error(err); }
        }

        async function loadVendorData(uid) {
            const { data, error } = await supabaseClient.from('vendors').select('*').eq('line_owner_uid', uid).single(); 
            if (!data) return;
            vendorData = data;
            document.getElementById('storeName').innerText = vendorData.name;
            if (vendorData.line_picture_url) document.getElementById('storeLogo').src = vendorData.line_picture_url;
            updateStoreStatusUI(vendorData.is_open);
            
            const baseUrl = window.location.href.split('dashboard.html')[0];
            document.getElementById('customerLinkText').value = `${baseUrl}customer.html?vid=${vendorData.id}`;
            document.getElementById('settingStoreName').value = vendorData.name;
            document.getElementById('settingPromptpay').value = vendorData.promptpay_number;

            await loadCategories(); loadMenuItems(); loadOrders();
        }

        // ==================== ระบบออเดอร์ (แสดงหมายเหตุ & ตัวเลือก) ====================
        async function loadOrders() {
            if (!vendorData) return; const orderListDiv = document.getElementById('orderList'); orderListDiv.innerHTML = '<p style="text-align: center; color: #888;">กำลังโหลด...</p>';
            const { data, error } = await supabaseClient.from('orders').select('*').eq('vendor_id', vendorData.id).in('status', ['pending', 'processing']).order('created_at', { ascending: true });
            if (!data || data.length === 0) { orderListDiv.innerHTML = '<p style="text-align: center; color: #888;">ยังไม่มีออเดอร์เข้าในขณะนี้</p>'; return; }
            
            let html = '';
            data.forEach((order, index) => {
                const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items; 
                let itemsHtml = ''; 
                
                // ดึงโครงสร้าง JSON (รองรับทั้งแบบ Object เดิม และแบบ Array ใหม่)
                const itemsArray = Array.isArray(items) ? items : Object.values(items);
                
                itemsArray.forEach(item => {
                    let optStr = item.option && item.option !== '' ? `<br><small style="color:#00BCD4;">👉 ตัวเลือก: ${item.option}</small>` : '';
                    let noteStr = item.note && item.note !== '' ? `<br><small style="color:#ff4d4f;">📝 หมายเหตุ: ${item.note}</small>` : '';
                    itemsHtml += `<li style="font-size: 15px; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 5px;"><b>${item.qty}x</b> ${item.name} ${optStr} ${noteStr}</li>`;
                });
                
                const d = new Date(order.created_at);
                const orderTime = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); 
                const orderRef = `${d.getFullYear().toString().slice(-2)}${('0'+(d.getMonth()+1)).slice(-2)}${('0'+d.getDate()).slice(-2)}-${order.id.substring(0,4).toUpperCase()}`; 
                const queueNum = index + 1;
                
                let actionButtons = '';
                if (order.status === 'pending') { 
                    actionButtons = `<button onclick="updateOrderStatus('${order.id}', 'processing', '${order.customer_uid}', '${orderRef}', ${queueNum})" style="background: #06C755; color: white; border: none; padding: 10px; border-radius: 5px; flex: 1;">✅ รับออเดอร์</button> <button onclick="updateOrderStatus('${order.id}', 'rejected', '${order.customer_uid}', '${orderRef}', ${queueNum})" style="background: #ff4d4f; color: white; border: none; padding: 10px; border-radius: 5px; flex: 1;">❌ ปฏิเสธ</button>`; 
                } else if (order.status === 'processing') { 
                    actionButtons = `<button onclick="updateOrderStatus('${order.id}', 'completed', '${order.customer_uid}', '${orderRef}', ${queueNum})" style="background: #2196F3; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%;">🏁 อาหารเสร็จแล้ว</button>`; 
                }
                
                html += `
                    <div class="card" style="border-left: 4px solid #06C755;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <h3 style="margin: 0;">คิวที่ ${queueNum} <span style="font-size: 12px; color: #888; font-weight: normal;">• ${orderTime}</span></h3>
                        </div>
                        <div style="display: flex; gap: 15px; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 8px;">
                            <div style="flex: 1;"><ul style="margin: 0; padding-left: 20px; color: #333; list-style-type: square;">${itemsHtml}</ul><p style="margin: 10px 0 0 0; font-weight: bold; color: #06C755;">ยอดโอน: ฿${order.total_price}</p></div>
                            <div style="text-align: center;"><a href="${order.slip_image_url}" target="_blank"><img src="${order.slip_image_url}" style="width: 70px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;"></a></div>
                        </div>
                        <div style="display: flex; gap: 10px;">${actionButtons}</div>
                    </div>`;
            }); 
            orderListDiv.innerHTML = html;
        }

        async function updateOrderStatus(orderId, newStatus, customerUid, orderRef, queueNum) {
            // ดำเนินการอัปเดตสถานะและยิงแจ้งเตือน LINE (โค้ดเดิม)
            await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId);
            loadOrders();
        }

        // ==================== ระบบจัดการเมนู (เพิ่มระบบ Options) ====================
        async function loadCategories() {
            const { data } = await supabaseClient.from('categories').select('*').eq('vendor_id', vendorData.id);
            categories = data || [];
            const selectEl = document.getElementById('menuCategorySelect'); selectEl.innerHTML = '<option value="">-- ไม่ระบุหมวดหมู่ --</option>';
            categories.forEach(cat => { selectEl.innerHTML += `<option value="${cat.id}">${cat.name}</option>`; });
        }

        async function addNewMenu() {
            const name = document.getElementById('menuName').value.trim(); const price = document.getElementById('menuPrice').value;
            const categoryId = document.getElementById('menuCategorySelect').value || null; 
            const options = document.getElementById('menuOptions').value.trim(); // <== ดึงค่าตัวเลือกย่อย

            if (!name || !price) { alert("กรุณากรอกชื่อและราคา"); return; }
            document.getElementById('saveMenuBtn').disabled = true;

            const updateData = { name: name, price: price, category_id: categoryId, options: options };

            if (editingMenuId) {
                await supabaseClient.from('menu_items').update(updateData).eq('id', editingMenuId);
            } else { 
                updateData.vendor_id = vendorData.id;
                updateData.is_available = true;
                await supabaseClient.from('menu_items').insert([updateData]); 
            }
            resetFormState(); loadMenuItems(); 
        }

        function resetFormState() {
            document.getElementById('menuName').value = ''; document.getElementById('menuPrice').value = ''; 
            document.getElementById('menuOptions').value = ''; // เคลียร์ช่อง
            editingMenuId = null; document.getElementById('formTitle').innerText = "🍔 เพิ่มเมนูใหม่";
            document.getElementById('saveMenuBtn').innerText = "💾 บันทึกเมนูใหม่"; document.getElementById('saveMenuBtn').disabled = false;
        }

        async function loadMenuItems() {
            const { data } = await supabaseClient.from('menu_items').select('*, categories(name)').eq('vendor_id', vendorData.id).order('created_at', { ascending: false });
            let html = '';
            (data || []).forEach(item => {
                const optBadge = item.options ? `<br><small style="color:#00BCD4;">[ตัวเลือก: ${item.options}]</small>` : '';
                html += `<div class="card" style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
                    <div style="flex: 1;"><h4 style="margin: 0;">${item.name}</h4><p style="margin: 0; color: #06C755;">฿${item.price}</p>${optBadge}</div>
                    <button onclick="editMenu('${item.id}', '${item.name}', ${item.price}, '${item.category_id || ''}', '${item.options || ''}')" style="background:#2196F3; color:white; border:none; padding:6px 10px; border-radius:4px; font-size:12px;">✏️ แก้ไข</button>
                    <button onclick="deleteMenu('${item.id}', '${item.name}')" style="background:#ff4d4f; color:white; border:none; padding:6px 10px; border-radius:4px; font-size:12px;">🗑️ ลบ</button>
                </div>`;
            });
            document.getElementById('menuList').innerHTML = html || '<p style="text-align:center;">ยังไม่มีเมนู</p>';
        }

        function editMenu(id, name, price, categoryId, options) { 
            editingMenuId = id; document.getElementById('menuName').value = name; document.getElementById('menuPrice').value = price; 
            document.getElementById('menuCategorySelect').value = categoryId || ''; 
            document.getElementById('menuOptions').value = options || ''; 
            document.getElementById('formTitle').innerText = "✏️ แก้ไขเมนู"; document.getElementById('saveMenuBtn').innerText = "💾 อัปเดตเมนู"; 
        }

        async function deleteMenu(id, name) { if(confirm("ลบเมนูนี้?")) { await supabaseClient.from('menu_items').delete().eq('id', id); loadMenuItems(); } }
        async function toggleStoreStatus() {
            const newStatus = !vendorData.is_open; 
            await supabaseClient.from('vendors').update({ is_open: newStatus }).eq('id', vendorData.id); 
            vendorData.is_open = newStatus; updateStoreStatusUI(newStatus); 
        }
        function updateStoreStatusUI(isOpen) {
            const btn = document.getElementById('storeStatusBtn');
            btn.innerText = isOpen ? "🟢 เปิดร้าน" : "🔴 ปิดร้าน"; btn.style.background = isOpen ? "white" : "#ff4d4f"; btn.style.color = isOpen ? "#06C755" : "white";
        }
        async function updateStoreSettings() {
            await supabaseClient.from('vendors').update({ name: document.getElementById('settingStoreName').value, promptpay_number: document.getElementById('settingPromptpay').value }).eq('id', vendorData.id);
            alert("อัปเดตสำเร็จ!");
        }

        // ฟังก์ชัน QR/Share (คงเดิม)
        function copyCustomerLink() { document.getElementById('customerLinkText').select(); document.execCommand("copy"); alert("คัดลอกแล้ว"); }
        function showCustomerQr() { document.getElementById('customerQrImage').src = `https://quickchart.io/qr?text=${encodeURIComponent(document.getElementById('customerLinkText').value)}&size=300`; document.getElementById('customerQrModal').style.display = 'flex'; }
        function closeCustomerQrModal() { document.getElementById('customerQrModal').style.display = 'none'; }
        function downloadCustomerQr() { const a = document.createElement('a'); a.href = document.getElementById('customerQrImage').src; a.download = 'QR.png'; a.click(); }
        function shareCustomerFlex() { alert("ส่งข้อความให้ลูกค้า"); }

        window.onload = initDashboard;
    </script>
</body>
</html>
