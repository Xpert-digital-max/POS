<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้านค้า</title>
    <!-- นำเข้า LIFF และ Supabase -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f6f8; }
        /* Header */
        .header { background: #06C755; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .store-info { display: flex; align-items: center; gap: 10px; }
        .store-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; object-fit: cover;}
        /* Tab Menu */
        .tab-menu { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-size: 16px; font-weight: bold; color: #777; }
        .tab-btn.active { color: #06C755; border-bottom: 3px solid #06C755; }
        /* Content */
        .content { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px;}
    </style>
</head>
<body>

    <!-- แถบด้านบน -->
    <div class="header">
        <div class="store-info">
            <img id="storeLogo" src="https://via.placeholder.com/40" alt="Logo">
            <h3 id="storeName" style="margin: 0;">กำลังโหลด...</h3>
        </div>
        <div>
            <!-- สวิตช์เปิด-ปิดร้าน (เดี๋ยวเรามาเขียนโค้ดเพิ่มทีหลัง) -->
            <label style="font-size: 14px;">เปิดรับออเดอร์</label>
        </div>
    </div>

    <!-- แถบเมนู (Tabs) -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('orders')">📋 ออเดอร์</button>
        <button class="tab-btn" onclick="switchTab('menu')">🍔 เมนูอาหาร</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ ตั้งค่า</button>
    </div>

    <!-- พื้นที่แสดงเนื้อหา -->
    <div class="content">
        <!-- หน้าออเดอร์ -->
        <div id="orders" class="tab-content active">
            <h2>คิวรอทำ</h2>
            <div id="orderList">
                <p style="text-align: center; color: #888;">ยังไม่มีออเดอร์เข้าในขณะนี้</p>
                <!-- การ์ดออเดอร์จะถูกดึงมาแทรกตรงนี้ -->
            </div>
        </div>

        <!-- หน้าจัดการเมนู -->
        <div id="menu" class="tab-content">
            <h2>จัดการเมนูอาหาร</h2>
            <button style="background: #06C755; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px;">+ เพิ่มเมนูใหม่</button>
            <div id="menuList" style="margin-top: 15px;">
                <!-- รายการอาหารจะมาโชว์ที่นี่ -->
            </div>
        </div>

        <!-- หน้าตั้งค่า -->
        <div id="settings" class="tab-content">
            <h2>การตั้งค่าร้านค้า</h2>
            <div class="card">
                <p>ข้อมูลร้านและระบบตั้งค่าอื่นๆ จะอยู่ที่นี่</p>
            </div>
        </div>
    </div>

    <!-- ส่วนของ JavaScript -->
    <script>
        // 1. ใส่ Key และ LIFF ID
        const supabaseUrl = 'https://bbceqmoibwlnltgpkdsf.supabase.co';
        const supabaseKey = 'sb_publishable_Tm2NO4vvT938VdnT4ZG_cQ_DFdh-r-5';
        const liffId = '2011781647-rkokpjId'; // ใส่ LIFF ID ตัวใหม่ที่เพิ่งสร้าง

        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        let vendorData = null; // เก็บข้อมูลร้านค้าของแม่ค้าคนนี้

        // 2. ฟังก์ชันสลับ Tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 3. เริ่มต้น LIFF และดึงข้อมูลร้าน
        async function initDashboard() {
            try {
                await liff.init({ liffId: liffId });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    loadVendorData(profile.userId);
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Init Error: ", err);
                document.getElementById('storeName').innerText = "โหลดข้อมูลล้มเหลว";
            }
        }

        // 4. ค้นหาร้านค้าจาก LINE UID
        async function loadVendorData(uid) {
            const { data, error } = await supabaseClient
                .from('vendors')
                .select('*')
                .eq('line_owner_uid', uid)
                .single(); // ดึงมาแค่แถวเดียว

            if (error || !data) {
                alert("ไม่พบข้อมูลร้านค้า กรุณาลงทะเบียนก่อนใช้งาน");
                window.location.href = "index.html"; // เด้งกลับไปหน้าลงทะเบียน
                return;
            }

            // ถ้าเจอข้อมูลร้าน ให้เอาชื่อและรูปมาโชว์
            vendorData = data;
            document.getElementById('storeName').innerText = vendorData.name;
            if(vendorData.line_picture_url) {
                document.getElementById('storeLogo').src = vendorData.line_picture_url;
            }
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
