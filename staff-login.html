<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพนักงาน - เข้าสู่ระบบ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-box h2 { color: #1a237e; margin-top: 0; margin-bottom: 5px; }
        .login-box p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 14px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: center; letter-spacing: 2px; }
        .form-control:focus { outline: none; border-color: #06C755; box-shadow: 0 0 0 2px rgba(6,199,85,0.2); }
        .btn { width: 100%; padding: 14px; background: #06C755; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { background: #05a044; }
        .error-msg { color: #d32f2f; font-size: 14px; margin-top: 15px; display: none; background: #ffebee; padding: 10px; border-radius: 6px; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>👨‍🍳 ระบบพนักงาน</h2>
        <p id="storeNameDisplay">กรุณากรอกรหัส PIN เพื่อเข้าใช้งาน</p>
        
        <div class="form-group">
            <label>รหัสพนักงาน (PIN 4 หลัก)</label>
            <input type="password" id="pinInput" class="form-control" maxlength="4" placeholder="****" inputmode="numeric" onkeyup="if(event.key === 'Enter') checkLogin()">
        </div>
        
        <button class="btn" id="loginBtn" onclick="checkLogin()">เข้าสู่ระบบ</button>
        <div id="errorMsg" class="error-msg">รหัส PIN ไม่ถูกต้อง</div>
    </div>

    <script>
        // ดึง vid (vendor id) และ bid (branch id) จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlVid = urlParams.get('vid');
        const urlBid = urlParams.get('bid'); // รับ bid เพื่อระบุสาขา (อาจจะเป็น null สำหรับสาขาหลัก)

        if (!urlVid) {
            alert("ไม่พบข้อมูลร้านค้า กรุณาเข้าผ่านลิงก์ที่เจ้าของร้านส่งให้");
            document.body.innerHTML = '<div style="text-align:center; padding: 50px; font-family:sans-serif;">ลิงก์ไม่สมบูรณ์</div>';
        }

        const supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);

        async function initLogin() {
            if(!urlVid) return;
            // โหลดชื่อร้านและสาขามาแสดง
            const { data } = await supabaseClient.from('vendors').select('name').eq('id', urlVid).single();
            if(data) {
                let display = `ร้าน ${data.name}`;
                if(urlBid) {
                    const { data: branch } = await supabaseClient.from('branches').select('branch_name').eq('id', urlBid).single();
                    if(branch) display += ` (${branch.branch_name})`;
                }
                document.getElementById('storeNameDisplay').innerText = display;
            }
        }

        async function checkLogin() {
            const pin = document.getElementById('pinInput').value;
            if (pin.length !== 4) {
                showError("กรุณากรอก PIN 4 หลัก");
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.innerText = "กำลังตรวจสอบ...";
            btn.disabled = true;
            document.getElementById('errorMsg').style.display = 'none';

            try {
                // ค้นหา PIN ในสาขาของร้านนี้
                let query = supabaseClient.from('branches').select('id, cashier_pin, kitchen_pin').eq('merchant_id', urlVid);
                if (urlBid) {
                    query = query.eq('id', urlBid);
                } else {
                    // หากไม่ได้ส่งสาขามา ให้เช็คที่สาขาหลัก
                    query = query.eq('branch_name', 'สาขาหลัก');
                }

                const { data, error } = await query.single();

                if (error || !data) {
                    throw new Error("ไม่พบข้อมูลสาขา");
                }

                if (pin === data.cashier_pin) {
                    // ล็อกอินสำเร็จ - แคชเชียร์ (บันทึกเซสชันและส่งไปหน้าแคชเชียร์)
                    saveSessionAndRedirect('cashier', data.cashier_pin);
                } else if (pin === data.kitchen_pin) {
                    // ล็อกอินสำเร็จ - ห้องครัว (บันทึกเซสชันและส่งไปหน้า KDS)
                    saveSessionAndRedirect('kitchen', data.kitchen_pin);
                } else {
                    showError("รหัส PIN ไม่ถูกต้อง");
                }

            } catch (err) {
                console.error(err);
                showError("เกิดข้อผิดพลาดในการตรวจสอบ");
            }
            
            btn.innerText = "เข้าสู่ระบบ";
            btn.disabled = false;
        }

        function saveSessionAndRedirect(role, pin) {
            // บันทึกข้อมูลเซสชันลงใน Local Storage ของเครื่องนี้
            const sessionData = {
                role: role,
                vid: urlVid,
                bid: urlBid,
                pin: pin,
                loginTime: new Date().getTime()
            };
            localStorage.setItem('staff_session', JSON.stringify(sessionData));

            // เปลี่ยนหน้าจอตามสิทธิ์ (Role)
            let targetPage = '';
            if (role === 'cashier') {
                targetPage = 'restaurant-orders.html';
            } else if (role === 'kitchen') {
                targetPage = 'kitchen.html';
            }

            // นำพารามิเตอร์ URL เดิมติดไปด้วย
            let url = `${targetPage}?vid=${urlVid}`;
            if(urlBid) url += `&bid=${urlBid}`;
            
            window.location.href = url;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('pinInput').value = '';
            document.getElementById('pinInput').focus();
        }

        window.onload = initLogin;
    </script>
</body>
</html>
